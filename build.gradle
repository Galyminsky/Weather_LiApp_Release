buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

plugins {
    id 'com.android.application' version '9.3.1' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
}

