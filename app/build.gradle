plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace = 'com.protonmail.jobforandroid.weather'
    compileSdk 37

    defaultConfig {
        applicationId "com.protonmail.jobforandroid.weather"
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName "1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes.each {
        def apiKeyFile = project.rootProject.file("apikey.properties")
        if (!apiKeyFile.isFile()) {
            throw new GradleException("WeatherAPI key is missing. Copy apikey.properties.example to apikey.properties and set API_KEY.")
        }

        Properties properties = new Properties()
        apiKeyFile.withInputStream { properties.load(it) }
        def rawApiKey = properties.getProperty("API_KEY")?.trim()
        if (!rawApiKey || !rawApiKey.startsWith('"') || !rawApiKey.endsWith('"')) {
            throw new GradleException("API_KEY must be set as a quoted value in apikey.properties.")
        }
        def apiKey = rawApiKey.substring(1, rawApiKey.length() - 1).trim()
        if (!apiKey || apiKey == "YOUR_WEATHERAPI_KEY") {
            throw new GradleException("API_KEY is empty or still a placeholder in apikey.properties.")
        }
        it.buildConfigField "String", "API_KEY", rawApiKey
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-location-license:12.0.1'

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'


}
